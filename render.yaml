# Render "Blueprint": tells Render how to run WPG Barracks (free plan).
# Render → New → Blueprint → pick the TTGRichieTT/wpgtracker repo.
services:
  - type: web
    name: wpg-barracks
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Supabase connection string (Session pooler), pasted in when Render asks.
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: WARCON_API_KEY
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: INGEST_KEY
        generateValue: true
      # Streams tab: live checks (optional, each platform works on its own).
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      # YouTube sign-in (Google OAuth client) so members can chat in YouTube streams as themselves.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: encrypts members' stream keys (without it the app makes its own and keeps it in the
      # database). Only set it before anyone saves a stream key, and never change it after.
      - key: STREAM_KEY_SECRET
        sync: false
