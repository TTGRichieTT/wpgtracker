<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WPG Barracks</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050a12; color: #e6eef7; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
    p { color: #8fa3b8; }
    button { margin-top: 16px; padding: 12px 24px; border-radius: 8px; border: 1px solid #58ccff; background: #29b6f6; color: #02121f; font-weight: 700; font-size: 16px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div>
    <img src="wpg-logo.webp" style="width:min(320px,80vw);height:auto" alt="WPG">
    <h1>Can't reach HQ</h1>
    <p>Check your internet connection and try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script src="app-url.js"></script>
  <script>
    document.getElementById('retry').onclick = function () { location.href = window.WPG_URL || '/'; };
  </script>
</body>
</html>
