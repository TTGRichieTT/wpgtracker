name: Build Android app

# Runs when you press "Run workflow" on GitHub (Actions tab).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: android-app
        run: npm ci

      - name: Point the app at the live website
        working-directory: android-app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: npm run sync

      - name: Load signing key
        env:
          KS: ${{ secrets.WPG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wpg.jks"
            echo "WPG_KEYSTORE=$RUNNER_TEMP/wpg.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No WPG_KEYSTORE_BASE64 secret. Building with a temporary key — phones will not accept it as an update to a WPG-signed app."
          fi

      - name: Build APK
        working-directory: android-app/android
        env:
          WPG_KEYSTORE_PASSWORD: ${{ secrets.WPG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/WPG-Barracks.apk"

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: WPG Barracks app (build ${{ github.run_number }})
          make_latest: true
          body: |
            Android app for WPG members. Download **WPG-Barracks.apk** below and open it on your phone.
            You may need to allow "Install unknown apps" for your browser.
            Sign in with Steam — a mod or admin must approve new accounts.
          files: WPG-Barracks.apk
